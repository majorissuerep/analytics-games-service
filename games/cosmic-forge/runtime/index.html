<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Forge — Powder Toy evaluation workbench</title>
  <link rel="stylesheet" href="app-theme.css">
  <script src="app-appearance.js" defer></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ui-canvas); background-image: var(--ui-canvas-image); color: var(--ui-ink); display: grid; grid-template-rows: auto 1fr; }
    header { padding: 10px 14px; border-bottom: 1px solid var(--ui-line); display: flex; gap: 16px; align-items: center; }
    #status { color: var(--ui-violet); background: var(--ui-violet-bg); border-radius: 999px; padding: 5px 10px; font-size: 12px; }
    main { min-height: 0; display: grid; place-items: center; overflow: auto; }
    canvas { display: none; max-width: 100%; image-rendering: pixelated; outline: none; }
    canvas.ready { display: block; }
    .error { color: var(--ui-negative); white-space: pre-wrap; }
  </style>
</head>
<body class="app-surface">
  <header class="ui-glass">
    <strong>Cosmic Forge evaluation workbench</strong>
    <span id="status">Loading content index…</span>
  </header>
  <main>
    <section class="ui-loading ui-loading-app" id="workbench-loading">
      <div class="ui-loading-content">
        <div class="ui-loading-heading"><strong id="loading-label" role="status">Loading content index…</strong><span id="loading-elapsed" role="timer" aria-label="Elapsed time">0s</span></div>
        <div class="ui-loading-meter" role="progressbar" aria-busy="true" aria-label="Opening Cosmic Forge" data-determinate="false"><span></span></div>
        <button id="retry" hidden>Retry workbench</button>
      </div>
    </section><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></main>
  <script src="runtime.js" type="module"></script>
</body>
</html>
