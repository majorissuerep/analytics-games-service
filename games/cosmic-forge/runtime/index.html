<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Forge — Powder Toy evaluation workbench</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #070b14; color: #dce7ff; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 10px 14px; border-bottom: 1px solid #26324b; display: flex; gap: 16px; align-items: center; }
    #status { color: #8fb7ff; }
    main { min-height: 0; display: grid; place-items: center; overflow: auto; }
    canvas { display: none; max-width: 100%; image-rendering: pixelated; outline: none; }
    canvas.ready { display: block; }
    .error { color: #ff8f8f; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <strong>Cosmic Forge evaluation workbench</strong>
    <span id="status">Loading content index…</span>
  </header>
  <main><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></main>
  <script src="runtime.js" type="module"></script>
</body>
</html>
