name: Deploy Develop

# Quality gate + preview deploy. Fires on every push to develop.
# The deploy URL is printed in the job log.
on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: develop
  cancel-in-progress: true

jobs:
  deploy-develop:
    name: Gate and deploy develop
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TARGET_PROJECT: analytics-games-service
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Quality gate: lint, unit tests, typecheck, workspace checks, build.
      # A failing gate stops the deploy.
      - name: Run quality gate
        run: npm run check

      # ── Run idempotent DB migrations before the build ──────────────────────
      - name: Run DB migrations
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Build & deploy to Vercel preview ───────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@56.4.1

      # Resolve the project by name (same as the production workflow) instead
      # of trusting the legacy VERCEL_PROJECT_ID secret.
      - name: Select analytics-games-service project
        run: |
          PROJECT_JSON=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_TARGET_PROJECT?teamId=$VERCEL_ORG_ID")
          PROJECT_ID=$(printf '%s' "$PROJECT_JSON" | jq -r '.id')
          test -n "$PROJECT_ID" && test "$PROJECT_ID" != "null"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Develop deployed: $URL"

      # ── Health-check the deployment before reporting success ──────────────
      - name: Health check develop deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$DEPLOY_URL/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Develop deployment healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s…"
            sleep 10
          done
          echo "Develop deployment never became healthy" && exit 1
