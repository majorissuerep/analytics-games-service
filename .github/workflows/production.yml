name: Production Deployment

# Fires on every push (or merge) to master.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TARGET_PROJECT: analytics-games-service

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── DB migrations run BEFORE building so the new schema is live
      # before any new code starts serving requests.
      # All statements use IF NOT EXISTS / IF EXISTS so they are safe to
      # re-run and safe against concurrent deploys.
      - name: Run DB migrations
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Build & deploy with blue/green so the old deployment keeps
      # serving traffic until we have verified the new one is healthy. ───────
      - name: Install Vercel CLI
        run: npm install --global vercel@56.4.1

      # Resolve the intended project by name instead of relying on the legacy
      # VERCEL_PROJECT_ID secret, which points at the former consensus-radar
      # project. Then provision the runtime database URL without printing it.
      - name: Select analytics-games-service project
        run: |
          PROJECT_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_TARGET_PROJECT?teamId=$VERCEL_ORG_ID")
          PROJECT_ID=$(printf '%s' "$PROJECT_JSON" | jq -r '.id')
          test -n "$PROJECT_ID" && test "$PROJECT_ID" != "null"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Configure production database on target project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          jq -n \
            --arg value "$DATABASE_URL" \
            '{key:"DATABASE_URL",value:$value,type:"encrypted",target:["production","preview"]}' \
            > /tmp/vercel-database-env.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vercel-database-env.json \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID" \
            >/dev/null
          rm -f /tmp/vercel-database-env.json

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Deploy WITHOUT assigning the domain yet (blue/green step 1).
      # The current production URL keeps serving the old deployment.
      - name: Deploy to Vercel (no domain assignment yet)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed (pending health check): $URL"

      # ── Health-check the new deployment before promoting ──────────────────
      # Retry for up to 5 minutes (30 attempts × 10s). The old deployment
      # remains live during this entire window.
      - name: Health check new deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          MAX=30
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$DEPLOY_URL/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "New deployment is healthy (HTTP $STATUS) — promoting to production"
              exit 0
            fi
            echo "Attempt $i/$MAX: got HTTP $STATUS, waiting 10s…"
            sleep 10
          done
          echo "::error::New deployment never became healthy — aborting promote. Old deployment is still live."
          exit 1

      - name: Verify stateful room API
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          STATUS=$(curl -s -o /tmp/room-smoke.json -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "content-type: application/json" \
            -X POST \
            --data '{"gameId":"chess","host":{"id":"deployment-smoke","name":"Deployment smoke"}}' \
            "$DEPLOY_URL/api/rooms")
          test "$STATUS" = "201"
          jq -e '.room.gameId == "chess" and (.room.code | length == 6)' /tmp/room-smoke.json >/dev/null

      # Exercise desktop entry/exit, Pip, and a complete four-player game on
      # the candidate deployment before it receives the production domain.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-browser-e2e-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      # ── Promote: atomically swap the domain to the new deployment ─────────
      # Only runs if the health check passed. This is the only moment the
      # old deployment stops serving production traffic.
      - name: Promote to production
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel promote "$DEPLOY_URL" \
            --token="$VERCEL_TOKEN" \
            --yes
          echo "Production promoted to: $DEPLOY_URL"
