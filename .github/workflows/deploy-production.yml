name: Deploy Production

# Quality gate + production deploy. Fires on every push (or merge) to master.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Gate and deploy production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TARGET_PROJECT: analytics-games-service
      PRODUCTION_URL: https://analytics-games-service.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Quality gate: lint, unit tests, typecheck, workspace checks, build.
      # A failing gate stops the deploy.
      - name: Run quality gate
        run: npm run check

      # ── DB migrations run BEFORE building so the new schema is live
      # before any new code starts serving requests.
      # All statements use IF NOT EXISTS / IF EXISTS so they are safe to
      # re-run and safe against concurrent deploys.
      - name: Run DB migrations
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Build and deploy the named analytics-games-service project directly.
      - name: Install Vercel CLI
        run: npm install --global vercel@56.4.1

      # Resolve the intended project by name instead of relying on the legacy
      # VERCEL_PROJECT_ID secret, which points at the former consensus-radar
      # project. Then provision the runtime database URL without printing it.
      - name: Select analytics-games-service project
        run: |
          PROJECT_JSON=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_TARGET_PROJECT?teamId=$VERCEL_ORG_ID")
          PROJECT_ID=$(printf '%s' "$PROJECT_JSON" | jq -r '.id')
          test -n "$PROJECT_ID" && test "$PROJECT_ID" != "null"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Configure production database on target project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHESS_MODEL_ABUSE_SALT: ${{ secrets.CHESS_MODEL_ABUSE_SALT }}
          CHESS_MODEL_ADMIN_TOKEN: ${{ secrets.CHESS_MODEL_ADMIN_TOKEN }}
        run: |
          for key in DATABASE_URL CHESS_MODEL_ABUSE_SALT CHESS_MODEL_ADMIN_TOKEN; do
            jq -n \
              --arg key "$key" \
              --arg value "${!key}" \
              '{key:$key,value:$value,type:"encrypted",target:["production","preview"]}' \
              > /tmp/vercel-env.json
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vercel-env.json \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID" \
              >/dev/null
          done
          rm -f /tmp/vercel-env.json

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy analytics-games-service to production
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployed: $URL"

      - name: Health check production deployment
        run: |
          curl --fail --silent --show-error \
            --output /tmp/health.json \
            "$PRODUCTION_URL/api/health"
          jq -e '.status == "ok"' /tmp/health.json >/dev/null
