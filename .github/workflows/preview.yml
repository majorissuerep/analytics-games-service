name: Preview Deployment

# Fires when a PR targeting master is opened/updated AND has the "deploy" label,
# or when the "deploy" label is added to an already-open PR.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-label:
    name: Check deployment label
    runs-on: ubuntu-latest
    outputs:
      has-label: ${{ steps.check.outputs.has-label }}
    steps:
      - id: check
        env:
          HAS_DEPLOY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'deploy') }}
        run: |
          echo "has-label=$HAS_DEPLOY_LABEL" >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: Deploy preview
    needs: check-label
    if: needs.check-label.outputs.has-label == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post the comment
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Run idempotent DB migrations before the build ──────────────────────
      - name: Run DB migrations
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Build & deploy to Vercel preview ───────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@56.4.1

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ── Health-check the preview before reporting success ──────────────────
      - name: Health check preview
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$DEPLOY_URL/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Preview healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s…"
            sleep 10
          done
          echo "Preview never became healthy" && exit 1

      # ── Post preview URL as PR comment ────────────────────────────────────
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          script: |
            const body = [
              '### Vercel Preview Deployment',
              '',
              `**URL:** ${process.env.DEPLOY_URL}`,
              '',
              `> Deployed from commit \`${process.env.DEPLOY_SHA}\``,
            ].join('\n');

            // Update existing bot comment if it exists, otherwise create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Vercel Preview Deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
