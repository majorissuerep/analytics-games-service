name: Check

# Single quality gate: lint, unit tests, typecheck, workspace checks, build.
# Runs on PRs to master and on pushes to the long-lived branches.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: analytics_games
          POSTGRES_PASSWORD: analytics_games
          POSTGRES_DB: analytics_games
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://analytics_games:analytics_games@localhost:5432/analytics_games?sslmode=disable
      EVENT_TRACKING_ENABLED: 'true'
      EVENT_WRITE_KEY: local-ci-placeholder
      EVENT_TRACKING_URL: http://127.0.0.1:9
      PLAYWRIGHT_START_SERVER: 'true'
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Install Playwright video encoder
        run: npx playwright install ffmpeg

      - name: Browser regression tests with real chess engines
        run: npx playwright test tests/e2e/platform.spec.ts tests/e2e/games-reliability.spec.ts
