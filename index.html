<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Consensus Radar</title>
<style>
  :root{
    --bg:#0a1929;
    --panel:#0f2438;
    --panel-2:#13304a;
    --ink:#eaf2fb;
    --ink-dim:#8fa9c4;
    --line:#21476b;
    --sweep:#33e1a1;
    --sweep-dim:#1c7a5c;
    --hot:#ff6b6b;
    --warm:#ffd166;
    --cold:#4d96ff;
    --gold:#ffce5c;
    --shadow:0 18px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(900px 600px at 50% -10%, #11314c 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 16px 48px;
  }
  /* fallback fonts: Space Grotesk likely absent offline -> system grotesk-ish */
  h1,h2,h3{font-weight:700;letter-spacing:-.02em;margin:0}
  .wrap{width:100%;max-width:760px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:40px;height:40px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, transparent 0 38%, var(--sweep-dim) 38% 40%, transparent 40% 62%, var(--sweep-dim) 62% 64%, transparent 64%);
    border:2px solid var(--line);position:relative;flex:0 0 auto;
  }
  .logo::after{
    content:"";position:absolute;left:50%;top:50%;width:50%;height:2px;
    background:linear-gradient(90deg,var(--sweep),transparent);
    transform-origin:left center;transform:rotate(-32deg);
    box-shadow:0 0 8px var(--sweep);
  }
  .brand h1{font-size:22px}
  .brand .sub{font-size:11px;color:var(--ink-dim);letter-spacing:.18em;text-transform:uppercase}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{
    background:transparent;color:var(--ink-dim);border:0;padding:7px 13px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .lang button.on{background:var(--sweep);color:#04241a}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:20px;padding:24px;
    box-shadow:var(--shadow);
  }
  .muted{color:var(--ink-dim)}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sweep);font-weight:600;margin-bottom:10px}
  p{line-height:1.55}
  .btn{
    background:var(--sweep);color:#04241a;border:0;border-radius:12px;
    padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:transform .08s ease, filter .15s ease;width:100%;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.warn{background:var(--warm);color:#3a2c00}
  .btn-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .btn-row .btn{flex:1;min-width:160px;width:auto}
  .field{margin:16px 0}
  label.lbl{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:7px;font-weight:600}
  input[type=text]{
    width:100%;background:#0a1f31;border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:16px;padding:14px;font-family:inherit;
  }
  input[type=text]:focus{outline:2px solid var(--sweep);outline-offset:-1px}
  .teams{display:flex;gap:12px;flex-wrap:wrap}
  .teamchip{
    flex:1;min-width:140px;background:#0a1f31;border:1px solid var(--line);
    border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;
  }
  .teamchip .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
  .teamchip input{background:transparent;border:0;color:var(--ink);font-size:15px;font-family:inherit;width:100%}
  .teamchip input:focus{outline:0}
  .scorebar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .scorebar .s{flex:1;min-width:120px;background:#0a1f31;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .scorebar .s .n{font-size:22px;font-weight:700}
  .scorebar .s.active{border-color:var(--sweep);box-shadow:0 0 0 1px var(--sweep) inset}
  .stage-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px}
  .pill{background:#0a1f31;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600}

  /* SCALE / RADAR */
  .scalewrap{margin:26px 0 8px;user-select:none}
  .poles{display:flex;justify-content:space-between;margin-bottom:10px;gap:10px}
  .pole{font-size:15px;font-weight:700;max-width:45%}
  .pole.left{text-align:left;color:var(--cold)}
  .pole.right{text-align:right;color:var(--hot)}
  .gauge{
    position:relative;height:160px;border-radius:14px;overflow:hidden;
    background:#08182600;border:1px solid var(--line);
    touch-action:none;cursor:pointer;
  }
  .gauge-fill{
    position:absolute;inset:0;
    background:linear-gradient(90deg,
      #2a5a8f 0%, #3f7bb5 22%, #5fae9d 45%, #8fcf6a 58%,
      #ffd166 72%, #ff9b54 86%, #ff6b6b 100%);
    opacity:.22;
  }
  .ticks{position:absolute;inset:0}
  .ticks .t{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.06)}
  .ticks .t.mid{background:rgba(255,255,255,.16)}
  .target-band{position:absolute;top:0;bottom:0;display:none}
  .target-band .zone{position:absolute;top:0;bottom:0}
  .zone.z5{background:rgba(255,206,92,.9)}
  .zone.z3{background:rgba(255,206,92,.45)}
  .zone.zline{width:2px;background:#fff;box-shadow:0 0 12px #ffce5c}
  .marker{
    position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--sweep);
    box-shadow:0 0 14px var(--sweep);transform:translateX(-50%);
  }
  .marker::before{
    content:"";position:absolute;top:-2px;left:50%;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;
    border-top:10px solid var(--sweep);
  }
  .marker .knob{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:26px;height:26px;border-radius:50%;background:var(--sweep);
    border:3px solid #04241a;box-shadow:0 0 16px var(--sweep);
  }
  .readout{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--ink-dim)}
  .readout b{color:var(--ink)}

  .reveal-target{display:none}
  .cluebox{
    margin:18px 0;background:#0a1f31;border:1px dashed var(--line);
    border-radius:12px;padding:16px;text-align:center;font-size:20px;font-weight:700;
    min-height:58px;display:flex;align-items:center;justify-content:center;
  }
  .cluebox.empty{color:var(--ink-dim);font-weight:500;font-size:15px}
  .scoredelta{font-size:15px;font-weight:700}
  .center{text-align:center}
  .big{font-size:54px;font-weight:700;line-height:1}
  .hint{font-size:13px;color:var(--ink-dim);margin-top:8px;line-height:1.5}
  .hide{display:none!important}
  .winner{color:var(--gold)}
  .tablerow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
  .tablerow:last-child{border-bottom:0}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:middle}
  .footer-note{font-size:12px;color:var(--ink-dim);text-align:center;margin-top:22px;line-height:1.6}
  @media (max-width:520px){
    .brand h1{font-size:18px}
    .big{font-size:42px}
    .pole{font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Consensus Radar</h1>
        <div class="sub" id="tagline">калібруй чуйку команди</div>
      </div>
    </div>
    <div class="lang">
      <button id="lang-uk" class="on" onclick="setLang('uk')">УКР</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <!-- SETUP -->
  <div id="screen-setup" class="card">
    <div class="eyebrow" data-t="setupEyebrow">Налаштування гри</div>
    <h2 data-t="setupTitle">Хто грає?</h2>
    <p class="muted" data-t="setupIntro" style="margin-top:8px"></p>

    <div class="field">
      <label class="lbl" data-t="teamsLabel">Команди (2–4)</label>
      <div class="teams" id="teamInputs"></div>
      <div class="btn-row">
        <button class="btn ghost" style="flex:0 0 auto" onclick="changeTeams(-1)">−</button>
        <button class="btn ghost" style="flex:0 0 auto" onclick="changeTeams(1)">+</button>
        <div style="flex:1"></div>
      </div>
    </div>

    <div class="field">
      <label class="lbl" data-t="roundsLabel">Раундів на команду</label>
      <div class="btn-row" id="roundPick" style="margin-top:0"></div>
    </div>

    <button class="btn" onclick="startGame()" data-t="startBtn">Почати гру</button>

    <div class="footer-note" data-t="setupHow"></div>
  </div>

  <!-- HANDOFF: pass laptop to clue-giver -->
  <div id="screen-handoff" class="card hide center">
    <div class="eyebrow" data-t="turnEyebrow">Хід</div>
    <h2><span id="handoffTeam"></span></h2>
    <p class="muted" data-t="handoffWho" style="margin-top:10px"></p>
    <div class="cluebox" style="border-style:solid">
      <span data-t="handoffPass"></span>
    </div>
    <p class="hint" data-t="handoffHint"></p>
    <button class="btn" onclick="showTarget()" data-t="handoffBtn">Я ведучий — показати ціль</button>
  </div>

  <!-- CLUE GIVER sees target -->
  <div id="screen-target" class="card">
    <div class="stage-meta">
      <span class="pill"><span id="targetTeam"></span></span>
      <span class="pill" data-t="secretPill">🤫 тільки для ведучого</span>
    </div>
    <div class="poles">
      <div class="pole left" id="t_poleL"></div>
      <div class="pole right" id="t_poleR"></div>
    </div>
    <div class="scalewrap">
      <div class="gauge" id="targetGauge">
        <div class="gauge-fill"></div>
        <div class="ticks" id="targetTicks"></div>
        <div class="target-band" id="targetBand" style="display:block">
          <div class="zone z3" id="tb3"></div>
          <div class="zone z5" id="tb5"></div>
          <div class="zone zline" id="tbline"></div>
        </div>
      </div>
    </div>
    <div class="center" style="margin-top:14px">
      <div class="muted" data-t="targetAt"></div>
      <div class="big" id="targetPct"></div>
    </div>
    <div class="field">
      <label class="lbl" data-t="clueLabel">Твій clue для команди</label>
      <input type="text" id="clueInput" autocomplete="off" placeholder="">
    </div>
    <button class="btn warn" onclick="submitClue()" data-t="clueBtn">Сховати ціль і передати команді</button>
    <p class="hint" data-t="targetHint"></p>
  </div>

  <!-- TEAM guesses -->
  <div id="screen-guess" class="card">
    <div class="stage-meta">
      <span class="pill"><span id="guessTeam"></span></span>
      <span class="pill" data-t="guessPill">🎯 ваш хід</span>
    </div>
    <div class="cluebox" id="clueDisplay"></div>
    <div class="poles">
      <div class="pole left" id="g_poleL"></div>
      <div class="pole right" id="g_poleR"></div>
    </div>
    <div class="scalewrap">
      <div class="gauge" id="guessGauge">
        <div class="gauge-fill"></div>
        <div class="ticks" id="guessTicks"></div>
        <div class="marker" id="guessMarker" style="left:50%"><div class="knob"></div></div>
      </div>
      <div class="readout">
        <span data-t="dragHint">Перетягни маркер</span>
        <span><b id="guessReadout">50</b> / 100</span>
      </div>
    </div>
    <button class="btn" onclick="lockGuess()" data-t="lockBtn">Зафіксувати відповідь</button>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="card">
    <div class="stage-meta">
      <span class="pill"><span id="resultTeam"></span></span>
      <span class="pill" id="resultDeltaPill"></span>
    </div>
    <div class="poles">
      <div class="pole left" id="r_poleL"></div>
      <div class="pole right" id="r_poleR"></div>
    </div>
    <div class="scalewrap">
      <div class="gauge" id="resultGauge">
        <div class="gauge-fill"></div>
        <div class="ticks" id="resultTicks"></div>
        <div class="target-band" id="resultBand" style="display:block">
          <div class="zone z3" id="rb3"></div>
          <div class="zone z5" id="rb5"></div>
          <div class="zone zline" id="rbline"></div>
        </div>
        <div class="marker" id="resultMarker"><div class="knob"></div></div>
      </div>
    </div>
    <div class="cluebox" id="resultClue" style="border-style:solid;font-size:16px"></div>
    <div class="center">
      <div class="scoredelta" id="resultVerdict"></div>
      <div class="hint" id="resultDetail"></div>
    </div>
    <div class="scorebar" id="resultScores" style="margin-top:18px"></div>
    <button class="btn" onclick="nextTurn()" id="nextBtn" data-t="nextBtn">Наступний хід</button>
  </div>

  <!-- FINAL -->
  <div id="screen-final" class="card center">
    <div class="eyebrow" data-t="finalEyebrow">Гру завершено</div>
    <h2 data-t="finalTitle">Фінальний рахунок</h2>
    <div id="finalTable" style="margin:20px 0;text-align:left"></div>
    <div class="big winner" id="finalWinner" style="margin:10px 0"></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="location.reload()" data-t="againBtn">Зіграти ще раз</button>
    </div>
  </div>

  <div class="footer-note">Consensus Radar · <span data-t="footerOffline">працює офлайн, без інтернету</span></div>
</div>

<script>
/* ============================ DATA ============================ */
const SCALES = [
  {l:{uk:"геніальна ідея",en:"brilliant idea"},          r:{uk:"повна дурня",en:"complete nonsense"}},
  {l:{uk:"ризиковано",en:"risky"},                        r:{uk:"безпечно",en:"safe"}},
  {l:{uk:"смішно",en:"hilarious"},                        r:{uk:"крінжово",en:"cringe"}},
  {l:{uk:"терміново",en:"urgent"},                        r:{uk:"може почекати",en:"can wait"}},
  {l:{uk:"дуже дорого",en:"very expensive"},              r:{uk:"дуже дешево",en:"very cheap"}},
  {l:{uk:"корисно",en:"useful"},                          r:{uk:"марно",en:"useless"}},
  {l:{uk:"переоцінено",en:"overrated"},                   r:{uk:"недооцінено",en:"underrated"}},
  {l:{uk:"я б це з’їв щодня",en:"I'd eat it daily"},      r:{uk:"ніколи в житті",en:"never in my life"}},
  /* analytics-flavored, lands for the team */
  {l:{uk:"стат. значущо",en:"statistically significant"}, r:{uk:"шум",en:"just noise"}},
  {l:{uk:"треба дашборд",en:"needs a dashboard"},         r:{uk:"вистачить одного числа",en:"one number is enough"}},
  {l:{uk:"data-driven рішення",en:"data-driven decision"},r:{uk:"вирішили по вайбу",en:"decided on vibes"}},
  {l:{uk:"релізити на 100%",en:"ship to 100%"},           r:{uk:"вбити фічу",en:"kill the feature"}},
  {l:{uk:"красивий графік",en:"beautiful chart"},         r:{uk:"pie chart із 9 секторів",en:"9-slice pie chart"}},
  {l:{uk:"роль на все життя",en:"dream job forever"},     r:{uk:"звільнився б завтра",en:"would quit tomorrow"}},
  {l:{uk:"топ-тір мем",en:"top-tier meme"},               r:{uk:"треш із 2012",en:"trash from 2012"}},
  {l:{uk:"корпоратив мрії",en:"dream company party"},     r:{uk:"краще попрацюю",en:"rather keep working"}},
];

const T = {
  uk:{
    tagline:"калібруй чуйку команди",
    setupEyebrow:"Налаштування гри", setupTitle:"Хто грає?",
    setupIntro:"Ведучий бачить таємну позицію на шкалі й дає одну підказку. Команда обговорює і ставить маркер якнайближче.",
    teamsLabel:"Команди (2–4)", roundsLabel:"Раундів на команду", startBtn:"Почати гру",
    setupHow:"Потрібен один ноутбук на всіх. На своєму ході команда обирає ведучого — решта на секунду відвертаються від екрана.",
    turnEyebrow:"Хід", handoffWho:"Оберіть одного ведучого в цій команді.",
    handoffPass:"Передайте ноутбук ведучому 👐",
    handoffHint:"Усі інші — не підглядайте в ціль. Чесність — це весь сенс гри.",
    handoffBtn:"Я ведучий — показати ціль",
    secretPill:"🤫 тільки для ведучого", targetAt:"Таємна позиція:",
    clueLabel:"Твій clue для команди", clueBtn:"Сховати ціль і передати команді",
    targetHint:"Дай одну фразу-асоціацію — не число, не «трохи лівіше». Запам’ятай позицію, далі її не буде видно.",
    cluePlaceholder:"напр. «корпоративний TikTok з танцями CEO»",
    guessPill:"🎯 ваш хід", dragHint:"Перетягни маркер", lockBtn:"Зафіксувати відповідь",
    nextBtn:"Наступний хід", finishBtn:"Підсумки",
    finalEyebrow:"Гру завершено", finalTitle:"Фінальний рахунок", againBtn:"Зіграти ще раз",
    footerOffline:"працює офлайн, без інтернету",
    bullseye:"В яблучко!", close:"Близько!", far:"Далеко…", opposite:"Не той бік 😬",
    points:"балів", clueWas:"Підказка:", targetWas:"Ціль була на", guessWas:"ви поставили",
    teamDefault:"Команда", roundsWord:"раунд", winnerPrefix:"Перемагає", tie:"Нічия!",
    youGuessed:"Ви поставили", off:"відхилення"
  },
  en:{
    tagline:"calibrate the team's instincts",
    setupEyebrow:"Game setup", setupTitle:"Who's playing?",
    setupIntro:"The clue-giver sees a secret point on the scale and gives one clue. The team debates and places the marker as close as it can.",
    teamsLabel:"Teams (2–4)", roundsLabel:"Rounds per team", startBtn:"Start game",
    setupHow:"You only need one shared laptop. On your turn pick a clue-giver — everyone else looks away from the screen for a second.",
    turnEyebrow:"Turn", handoffWho:"Pick one clue-giver in this team.",
    handoffPass:"Hand the laptop to the clue-giver 👐",
    handoffHint:"Everyone else: don't peek at the target. Honesty is the whole game.",
    handoffBtn:"I'm the clue-giver — show the target",
    secretPill:"🤫 clue-giver only", targetAt:"Secret position:",
    clueLabel:"Your clue for the team", clueBtn:"Hide target & hand to team",
    targetHint:"Give one association — not a number, not “a bit left”. Memorize the spot; it disappears next.",
    cluePlaceholder:"e.g. “corporate TikTok of the CEO dancing”",
    guessPill:"🎯 your turn", dragHint:"Drag the marker", lockBtn:"Lock in answer",
    nextBtn:"Next turn", finishBtn:"See results",
    finalEyebrow:"Game over", finalTitle:"Final score", againBtn:"Play again",
    footerOffline:"runs offline, no internet",
    bullseye:"Bullseye!", close:"Close!", far:"Too far…", opposite:"Wrong side 😬",
    points:"points", clueWas:"Clue:", targetWas:"Target was at", guessWas:"you placed",
    teamDefault:"Team", roundsWord:"round", winnerPrefix:"Winner:", tie:"It's a tie!",
    youGuessed:"You placed", off:"off by"
  }
};

const TEAM_COLORS = ["#33e1a1","#ffd166","#ff6b6b","#4d96ff"];

/* ============================ STATE ============================ */
let lang = "uk";
let state = {
  teams: [],            // {name,color,score}
  roundsPerTeam: 3,
  numTeams: 2,
  turnOrder: [],        // queue of team indices
  turnPtr: 0,
  totalTurns: 0,
  current: null,        // {teamIdx, scale, target, clue, guess}
  usedScales: []
};

/* ============================ HELPERS ============================ */
const $ = id => document.getElementById(id);
function tr(k){ return T[lang][k] || k; }
function screens(){ return ["setup","handoff","target","guess","result","final"]; }
function show(name){
  screens().forEach(s=>{ const el=$("screen-"+s); if(el) el.classList.toggle("hide", s!==name); });
  window.scrollTo({top:0,behavior:"smooth"});
}
function pct(x){ return Math.max(0,Math.min(100,x)); }

/* ============================ LANG ============================ */
function setLang(l){
  lang=l;
  $("lang-uk").classList.toggle("on", l==="uk");
  $("lang-en").classList.toggle("on", l==="en");
  document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent=tr(el.getAttribute("data-t")); });
  $("tagline").textContent=tr("tagline");
  $("clueInput").placeholder=tr("cluePlaceholder");
  // re-render dynamic bits
  renderRoundPick();
  if(state.current){ renderPolesAll(); }
}

/* ============================ SETUP ============================ */
function renderTeamInputs(){
  const box=$("teamInputs"); box.innerHTML="";
  for(let i=0;i<state.numTeams;i++){
    const c=TEAM_COLORS[i];
    const existing = state.teams[i] ? state.teams[i].name : "";
    const div=document.createElement("div");
    div.className="teamchip";
    div.innerHTML=`<span class="dot" style="background:${c}"></span>
      <input type="text" id="team-${i}" placeholder="${tr('teamDefault')} ${i+1}" value="${existing}">`;
    box.appendChild(div);
  }
}
function changeTeams(d){
  // capture current names
  for(let i=0;i<state.numTeams;i++){ const el=$("team-"+i); if(el){ state.teams[i]={name:el.value}; } }
  state.numTeams=Math.max(2,Math.min(4,state.numTeams+d));
  renderTeamInputs();
}
function renderRoundPick(){
  const box=$("roundPick"); box.innerHTML="";
  [2,3,4,5].forEach(n=>{
    const b=document.createElement("button");
    b.className="btn ghost"+(state.roundsPerTeam===n?"":"");
    b.style.flex="1"; b.style.minWidth="64px";
    b.textContent=n;
    if(state.roundsPerTeam===n){ b.style.background="var(--sweep)"; b.style.color="#04241a"; }
    b.onclick=()=>{ state.roundsPerTeam=n; renderRoundPick(); };
    box.appendChild(b);
  });
}

/* ============================ GAUGE RENDER ============================ */
function renderTicks(elId){
  const el=$(elId); el.innerHTML="";
  for(let i=0;i<=10;i++){
    const t=document.createElement("div");
    t.className="t"+(i===5?" mid":"");
    t.style.left=(i*10)+"%";
    el.appendChild(t);
  }
}
function placeBand(pre, target){
  // z5: +/-4 (center bullseye), z3: +/-12 (close)
  const z5=4, z3=12;
  $(pre+"5").style.left=pct(target-z5)+"%";
  $(pre+"5").style.width=(Math.min(100,target+z5)-Math.max(0,target-z5))+"%";
  $(pre+"3").style.left=pct(target-z3)+"%";
  $(pre+"3").style.width=(Math.min(100,target+z3)-Math.max(0,target-z3))+"%";
  $(pre+"line").style.left=target+"%";
}
function renderPolesAll(){
  const s=state.current.scale;
  ["t_pole","g_pole","r_pole"].forEach(p=>{
    if($(p+"L")) $(p+"L").textContent=s.l[lang];
    if($(p+"R")) $(p+"R").textContent=s.r[lang];
  });
}

/* ============================ FLOW ============================ */
function startGame(){
  // finalize team names
  const teams=[];
  for(let i=0;i<state.numTeams;i++){
    const el=$("team-"+i);
    const name=(el && el.value.trim()) ? el.value.trim() : `${tr('teamDefault')} ${i+1}`;
    teams.push({name, color:TEAM_COLORS[i], score:0});
  }
  state.teams=teams;
  // build turn order: round-robin
  state.turnOrder=[];
  for(let r=0;r<state.roundsPerTeam;r++){
    for(let i=0;i<teams.length;i++) state.turnOrder.push(i);
  }
  state.turnPtr=0;
  state.totalTurns=state.turnOrder.length;
  beginTurn();
}

function pickScale(){
  if(state.usedScales.length>=SCALES.length) state.usedScales=[];
  let idx;
  do{ idx=Math.floor(Math.random()*SCALES.length); } while(state.usedScales.includes(idx));
  state.usedScales.push(idx);
  return SCALES[idx];
}

function beginTurn(){
  const teamIdx=state.turnOrder[state.turnPtr];
  const scale=pickScale();
  const target=Math.floor(Math.random()*81)+10; // 10..90, avoid extreme edges
  state.current={teamIdx, scale, target, clue:"", guess:50};
  renderPolesAll();
  // handoff screen
  const team=state.teams[teamIdx];
  $("handoffTeam").innerHTML=`<span class="swatch" style="background:${team.color}"></span>${team.name}`;
  show("handoff");
}

function showTarget(){
  const c=state.current, team=state.teams[c.teamIdx];
  $("targetTeam").innerHTML=`<span class="swatch" style="background:${team.color}"></span>${team.name}`;
  renderTicks("targetTicks");
  placeBand("tb", c.target);
  $("targetPct").textContent=c.target;
  $("clueInput").value="";
  $("clueInput").placeholder=tr("cluePlaceholder");
  show("target");
  setTimeout(()=>$("clueInput").focus(),250);
}

function submitClue(){
  const v=$("clueInput").value.trim();
  state.current.clue = v;
  // team guess screen
  const c=state.current, team=state.teams[c.teamIdx];
  $("guessTeam").innerHTML=`<span class="swatch" style="background:${team.color}"></span>${team.name}`;
  const cd=$("clueDisplay");
  if(v){ cd.textContent="“"+v+"”"; cd.classList.remove("empty"); }
  else { cd.textContent=lang==="uk"?"(ведучий дав підказку вголос)":"(clue given out loud)"; cd.classList.add("empty"); }
  renderTicks("guessTicks");
  setGuess(50);
  show("guess");
}

/* ---- draggable marker ---- */
function setGuess(v){
  v=pct(Math.round(v));
  state.current.guess=v;
  $("guessMarker").style.left=v+"%";
  $("guessReadout").textContent=v;
}
function gaugeValueFromEvent(e, gauge){
  const rect=gauge.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  return (x/rect.width)*100;
}
function attachDrag(){
  const gauge=$("guessGauge");
  let dragging=false;
  const move=e=>{ if(!dragging)return; e.preventDefault(); setGuess(gaugeValueFromEvent(e,gauge)); };
  const down=e=>{ dragging=true; setGuess(gaugeValueFromEvent(e,gauge)); };
  const up=()=>{ dragging=false; };
  gauge.addEventListener("mousedown",down);
  gauge.addEventListener("touchstart",down,{passive:false});
  window.addEventListener("mousemove",move);
  window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);
  window.addEventListener("touchend",up);
}

function scoreFor(guess,target){
  const d=Math.abs(guess-target);
  if(d<=4)  return {pts:5, key:"bullseye"};
  if(d<=12) return {pts:3, key:"close"};
  // opposite side of midpoint AND far
  const oppositeSide = (guess-50)*(target-50) < 0;
  if(oppositeSide && d>30) return {pts:-2, key:"opposite"};
  return {pts:0, key:"far"};
}

function lockGuess(){
  const c=state.current;
  const res=scoreFor(c.guess,c.target);
  state.teams[c.teamIdx].score += res.pts;
  // render result
  const team=state.teams[c.teamIdx];
  $("resultTeam").innerHTML=`<span class="swatch" style="background:${team.color}"></span>${team.name}`;
  renderTicks("resultTicks");
  placeBand("rb", c.target);
  $("resultMarker").style.left=c.guess+"%";
  const sign=res.pts>0?"+":"";
  $("resultDeltaPill").textContent=`${sign}${res.pts} ${tr("points")}`;
  $("resultDeltaPill").style.color = res.pts>0?"#04241a":"var(--ink)";
  $("resultDeltaPill").style.background = res.pts>0?"var(--sweep)":(res.pts<0?"var(--hot)":"#0a1f31");
  const rc=$("resultClue");
  if(c.clue){ rc.textContent=`${tr("clueWas")} “${c.clue}”`; }
  else { rc.textContent = lang==="uk"?"(підказка була усною)":"(clue was spoken)"; }
  $("resultVerdict").textContent=tr(res.key);
  $("resultVerdict").style.color = res.pts>0?"var(--sweep)":(res.pts<0?"var(--hot)":"var(--ink-dim)");
  const off=Math.abs(c.guess-c.target);
  $("resultDetail").textContent=`${tr("targetWas")} ${c.target} · ${tr("youGuessed")} ${c.guess} · ${tr("off")} ${off}`;
  renderScoreBar("resultScores", c.teamIdx);
  // next button label
  const isLast = state.turnPtr >= state.totalTurns-1;
  $("nextBtn").textContent = isLast ? tr("finishBtn") : tr("nextBtn");
  show("result");
}

function renderScoreBar(containerId, activeIdx){
  const box=$(containerId); box.innerHTML="";
  state.teams.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="s"+(i===activeIdx?" active":"");
    d.innerHTML=`<div class="muted" style="font-size:12px">
        <span class="swatch" style="background:${t.color}"></span>${t.name}</div>
      <div class="n">${t.score}</div>`;
    box.appendChild(d);
  });
}

function nextTurn(){
  state.turnPtr++;
  if(state.turnPtr>=state.totalTurns){ showFinal(); return; }
  beginTurn();
}

function showFinal(){
  const sorted=[...state.teams].sort((a,b)=>b.score-a.score);
  const box=$("finalTable"); box.innerHTML="";
  sorted.forEach((t,i)=>{
    const row=document.createElement("div");
    row.className="tablerow";
    row.innerHTML=`<span><b style="color:${t.color}">${i+1}.</b>
        <span class="swatch" style="background:${t.color}"></span>${t.name}</span>
      <b>${t.score}</b>`;
    box.appendChild(row);
  });
  const top=sorted[0].score;
  const winners=sorted.filter(t=>t.score===top);
  $("finalWinner").textContent = winners.length>1
    ? tr("tie")
    : `🏆 ${winners[0].name}`;
  show("final");
}

/* ============================ INIT ============================ */
function init(){
  renderTeamInputs();
  renderRoundPick();
  setLang("uk");
  attachDrag();
}
init();
</script>
</body>
</html>
