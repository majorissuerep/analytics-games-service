<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Cadet Pinball</title>
  <link rel="stylesheet" href="/styles/app-theme.css"><link rel="stylesheet" href="cabinet.css">
  <script src="/styles/app-appearance.js" defer></script>
</head>
<body class="app-surface">
  <header class="pinball-bar ui-glass">
    <div class="pinball-identity"><span class="pinball-eyebrow">FLIGHT DECK / 01</span><strong>Space Cadet</strong></div>
    <button id="new-game" class="ui-primary" title="New game · F2" disabled>New game</button><button id="pause" title="Pause or resume · F3" disabled>Pause</button>
    <button id="sound" disabled aria-pressed="false">Sound off</button>
    <button id="exit">Exit</button>
  </header>
  <details class="pinball-data-tools">
    <summary>Table files <span id="art-label">Open Cadet art · CC0</span></summary>
    <div class="pinball-data-content"><label class="pinball-import">Use original XP files <input id="original-files" type="file" accept=".dat,.wav,.mid,.bmp" multiple></label>
    <span>Choose your own game data and sounds. Files stay in this browser.</span><button id="free-play" hidden>Return to free-play art</button></div>
  </details>
  <main class="pinball-stage" aria-label="Space Cadet game">
    <canvas id="canvas" tabindex="0" aria-label="Space Cadet pinball table" hidden></canvas>
    <section class="ui-loading ui-loading-app" id="loader">
      <div class="ui-loading-content">
        <div class="ui-loading-heading"><div role="status" aria-live="polite"><strong id="loading-label">Loading Space Cadet</strong><span class="ui-loading-detail" id="loading-detail">Preparing the engine and free-play table.</span></div><span class="ui-loading-elapsed" role="timer" aria-label="Elapsed time" id="elapsed">0s</span></div>
        <div class="ui-loading-meter" id="progress" role="progressbar" aria-label="Loading Space Cadet" data-determinate="false"><span></span></div>
        <div class="ui-loading-footer"><small id="progress-value">Working…</small><button id="retry" hidden>Retry Pinball</button></div>
      </div>
    </section>
  </main>
  <div class="pinball-touch-controls" role="group" aria-label="Touch controls">
    <button disabled data-key="z" data-code="KeyZ" data-keycode="90" aria-label="Left flipper"><span>Left flipper</span><kbd>Z</kbd></button>
    <button disabled data-key=" " data-code="Space" data-keycode="32" aria-label="Hold to launch"><span>Hold to launch</span><kbd>Space</kbd></button>
    <button disabled data-key="/" data-code="Slash" data-keycode="191" aria-label="Right flipper"><span>Right flipper</span><kbd>/</kbd></button>
  </div>
  <footer><span id="notice" role="status">F2 new game · F3 pause · Z / flippers · Space launch</span><a href="/vendor/space-cadet/UPSTREAM.md" target="_blank" rel="noopener">Engine &amp; asset licenses</a></footer>
  <script type="module" src="cabinet.js"></script>
</body>
</html>
